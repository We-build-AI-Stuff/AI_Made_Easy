[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-made-easy"
version = "3.10.0"
description = "Visual model builder: design neural networks, classic ML, probabilistic models and multi-stage pipelines, train them, and export clean PyTorch, Keras, scikit-learn, pgmpy and PyMC code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [{ name = "AI Made Easy" }]
dependencies = [
    "PySide6>=6.6",
    "OdenGraphQt>=0.7",
    "Jinja2>=3.1",
    "pyqtgraph>=0.13",
    # OdenGraphQt imports `distutils`, removed from the stdlib in Python
    # 3.12 — setuptools ships the shim that keeps that import working.
    "setuptools>=68",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]
tensorflow = ["tensorflow>=2.15"]
llm = [
    "transformers>=4.40",
    "datasets>=2.19",
    "peft>=0.11",
    "tokenizers>=0.19",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]
vision = ["torchvision>=0.21", "pillow>=10"]
# detection / segmentation / keypoints: timm + Hugging Face models, COCO RLE masks
# scipy: DETR's Hungarian matching loss
vision-tasks = ["torchvision>=0.23", "pillow>=10", "timm>=1.0", "transformers>=4.45",
                "pycocotools>=2.0", "scipy>=1.10"]
# speech encoders (wav2vec 2.0, HuBERT, WavLM, Whisper)
audio = ["transformers>=4.45"]
# pretrained text encoders (BERT, DistilBERT, RoBERTa, MiniLM, ...) and their tokenizers
text = ["transformers>=4.45", "tokenizers>=0.19"]
# graphical models, HMMs, Bayesian models, Gaussian processes
probabilistic = ["pgmpy>=1.1", "hmmlearn>=0.3", "pymc>=5.16", "gpytorch>=1.11",
                 "statsmodels>=0.14", "scikit-learn>=1.4", "pandas>=2.0", "scipy>=1.10",
                 "pillow>=10"]
graph = ["torch_geometric>=2.5", "scipy>=1.10", "pandas>=2.0", "ogb>=1.3"]
# Stable Diffusion LoRA fine-tuning
generative = ["diffusers>=0.30", "peft>=0.11", "transformers>=4.45", "pillow>=10"]
rl = ["gymnasium>=1.0", "stable-baselines3>=2.3"]
# Atari games through the Arcade Learning Environment; AI Made Easy never ships ROMs
# (docs/RL.md: which ale-py wheels include them, and how to add your own)
atari = ["ale-py>=0.9", "gymnasium>=1.0", "stable-baselines3>=2.3", "opencv-python-headless>=4.8"]
# Box2D environments (LunarLander, BipedalWalker, CarRacing)
rl-box2d = ["gymnasium[box2d]>=1.0", "stable-baselines3>=2.3"]
data = ["pandas>=2.0", "pyarrow>=14", "openpyxl>=3.1"]
classic = ["scikit-learn>=1.4", "joblib>=1.3", "xgboost>=2.0", "lightgbm>=4.0",
           "catboost>=1.2", "pandas>=2.0"]
keras = ["keras>=3.6"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1", "skl2onnx>=1.17"]
# on-device exports: ExecuTorch (.pte, XNNPACK) for PyTorch, the LiteRT interpreter to
# check .tflite files (Keras -> LiteRT also needs the tensorflow extra)
edge = ["executorch>=1.0", "ai-edge-litert>=1.2"]
coreml = ["coremltools>=8.0"]          # Core ML exports; checked against PyTorch on macOS
openvino = ["openvino>=2025.0"]        # OpenVINO exports (Intel CPUs, GPUs and NPUs)
tuning = ["optuna>=3.6"]
# UMAP embeddings in classic pipelines
umap = ["umap-learn>=0.5", "scikit-learn>=1.4"]
imbalance = ["imbalanced-learn>=0.12", "scikit-learn>=1.4"]
explain = ["shap>=0.46"]
# train on Kaggle / Modal (SSH, Colab and containers need no Python packages)
kaggle = ["kaggle>=1.6"]
modal = ["modal>=0.64"]
# mirror runs to MLflow (a local SQLite store unless MLFLOW_TRACKING_URI) and W&B
tracking = ["mlflow-skinny>=3.0", "sqlalchemy>=2.0", "alembic>=1.13", "wandb>=0.19"]
# push runs / Spaces to the Hugging Face Hub, load Hub datasets
hub = ["huggingface_hub>=0.34", "datasets>=3.0", "pyarrow>=14"]
web = ["ai-made-easy[serve]"]
all = ["ai-made-easy[torch,vision,vision-tasks,audio,text,generative,probabilistic,graph,rl,data,classic,umap,imbalance,explain,keras,llm,mcp-server,serve,export,tuning,tracking,hub,kaggle]"]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pytest-timeout>=2.3", "pytest-xdist>=3.6", "pillow>=10",
       "ruff>=0.6", "httpx>=0.27", "httpx2>=2.0"]  # Starlette's TestClient prefers httpx2
perception = ["sounddevice>=0.4"]
mcp-server = ["mcp[cli]>=1.0,<2"]

[project.gui-scripts]
ai-made-easy = "ai_made_easy.__main__:main"

[project.scripts]
aime = "ai_made_easy.cli:main"
aime-mcp = "ai_made_easy.mcp.server:main"

[tool.setuptools.packages.find]
include = ["ai_made_easy*"]

[tool.setuptools.package-data]
ai_made_easy = ["samples/*.json", "assets/*", "core/zoo/*.json", "core/devices.json", "server/static/*", "server/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# a hung test fails with every thread's stack instead of stalling CI for hours; "thread"
# also fires while blocked in C (a socket read, a Qt event loop), where SIGALRM would not
timeout = 900
timeout_method = "thread"
# four workers, one test file each (module fixtures train once); -n0 runs in one process.
# A plain run leaves out tests/slow_tests.txt: AIME_TESTS=all (as CI) or --run-slow runs them
addopts = "-n auto --maxprocesses=4 --dist loadfile"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/golden", "reference", "exports"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B006", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
