name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# every job runs the whole suite, slow tests included (a plain local `pytest` leaves
# out tests/slow_tests.txt)
env:
  AIME_TESTS: all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ai_made_easy scripts tests

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
        shard: [""]
        include:
          - os: ubuntu-latest
            python: "3.13"
            shard: ""
          - os: ubuntu-latest
            python: "3.14"
            shard: ""
          # Windows runs the suite in two halves (tests/conftest.py: AIME_SHARD)
          - os: windows-latest
            python: "3.12"
            shard: "1/2"
          - os: windows-latest
            python: "3.12"
            shard: "2/2"
    # the shard joins the job name only where there is one, so the required check names
    # ("test (ubuntu-latest, 3.12)") stay as they are
    name: test (${{ matrix.os }}, ${{ matrix.python }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 60 }}
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
      AIME_SHARD: ${{ matrix.shard }}
      # a worker that dies prints its stack, and is not replaced: the run ends and names
      # the test instead of hanging until the job's time limit (3.7, ubuntu 3.11)
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System libraries for headless Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: OpenMP runtime for XGBoost / LightGBM
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,classic,umap,imbalance,explain,keras,mcp-server,serve,export,tuning]" "${{ matrix.python == '3.11' && 'pandas<3' || 'pandas>=3' }}"
      - name: Test
        # Python 3.11 keeps pandas 2 covered; the others run pandas 3
        run: pytest -q -p no:cacheprovider --max-worker-restart=0 -rfEx
      - name: Was a test worker killed for memory?
        # a worker that dies without a Python stack was killed outright (3.8, ubuntu 3.11)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo dmesg -T | grep -iE "out of memory|killed process|oom" | tail -20 || true
          free -m
      - name: Every sample and recipe validates and generates code
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/sweep_e2e.py
      - name: A real SSH server on localhost
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh || sudo service ssh start
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          printf 'Host aime-ci\n  HostName localhost\n' >> ~/.ssh/config
          ssh -o BatchMode=yes aime-ci true
      - name: Train over real SSH (matches local, survives a cut connection)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          AIME_SSH_TEST_HOST: aime-ci
        run: pytest -q -p no:cacheprovider tests/test_backends.py -k real_ssh

  test-vision:
    # the vision-tasks extra (timm, transformers, pycocotools): every vision block and
    # training loop runs offline with random weights
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,vision-tasks,generative,serve,export]"
      - name: Test
        run: >-
          pytest -q -p no:cacheprovider tests/test_vision.py
          tests/test_codegen_runtime.py -k "vision or exercised or Vision"
      - name: Detectors and segmenters export to ONNX / TorchScript
        run: >-
          pytest -q -p no:cacheprovider tests/test_export.py
          -k "vision_heads or detector_package"
      - name: Pretrained image recipes (random weights)
        run: pytest -q -p no:cacheprovider tests/test_pretrained_recipes.py -k "image or budget"
      - name: Detectors from blocks, Mask2Former, Stable Diffusion LoRA (tiny, offline)
        run: >-
          pytest -q -p no:cacheprovider tests/test_block_coverage.py
          -k "yolo or mask2former or stable_diffusion or inception or every_layer"

  test-probabilistic:
    # the probabilistic extra: graphical models, HMMs and their generated scripts
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,probabilistic,serve]"
      - name: Test
        run: pytest -q -p no:cacheprovider tests/test_pgm.py tests/test_ppl.py tests/test_gp.py tests/test_ssm.py
      - name: Your series and grouped tables
        run: pytest -q -p no:cacheprovider tests/test_your_data.py -k "series_recipes or grouped_table"
      - name: AutoML for every family (held-out metrics, structured costs, parallel trials)
        run: pytest -q -p no:cacheprovider tests/test_automl_families.py
      - name: MvNormal / LKJ, MMHC, time-varying coefficients
        run: >-
          pytest -q -p no:cacheprovider tests/test_block_coverage.py
          -k "multivariate or lkj or mmhc or time_varying"

  test-graph-rl:
    # the graph and rl extras: PyTorch Geometric, Gymnasium and stable-baselines3
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,graph,rl,rl-box2d,atari,serve,export]"
      - name: Test
        run: >-
          pytest -q -p no:cacheprovider tests/test_gnn.py tests/test_rl.py
          tests/test_codegen_runtime.py -k "graph or exercised"
      - name: OGB (official splits and evaluators), Atari, custom environments
        run: pytest -q -p no:cacheprovider tests/test_deferred.py -k "ogb or atari or custom"
      - name: Graph networks export to ONNX (any number of nodes and edges)
        run: pytest -q -p no:cacheprovider tests/test_export.py -k "graph"
      - name: Your graphs and interaction tables
        run: pytest -q -p no:cacheprovider tests/test_your_data.py -k "recommender_and_graph"
      - name: CNN policies on pixels and Box2D
        run: >-
          pytest -q -p no:cacheprovider tests/test_block_coverage.py
          -k "pixel or cnn_policy or lunar"

  test-edge:
    # on-device exports: ExecuTorch (float / int8) for every sample, Keras -> LiteRT
    # (float / int8) through a TensorFlow-backend process, as users with tensorflow get
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
      AIME_SLOW: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,keras,serve,export,edge,graph]" tensorflow-cpu pandas
      - name: Every sample round-trips; packages check exports on the run's samples
        run: pytest -q -p no:cacheprovider tests/test_export.py

  test-coreml:
    # 3.9: Core ML on macOS, where the converted programs run: every sample and the 3.7 /
    # 3.8 layers match PyTorch within float16 tolerance, or an export rule says why not.
    # 3.11: OpenVINO on Apple silicon too (ARM CPUs, within exporters.ARM_TOL)
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
      AIME_TESTS: all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision
          pip install -e ".[dev,export,coreml,openvino]"
      - name: Core ML exports run and match PyTorch
        run: pytest -q -p no:cacheprovider tests/test_coreml.py tests/test_export.py -k "coreml or core_ml"
      - name: OpenVINO exports run and match PyTorch on ARM
        run: pytest -q -p no:cacheprovider tests/test_openvino.py tests/test_export.py -k "openvino"

  test-openvino:
    # 3.10: OpenVINO on x86 Linux: every sample and the 3.7 / 3.8 layers run on the CPU
    # and match PyTorch in float32, or an export rule says why not. 3.11: GGUF exports
    # load in llama.cpp (llama-cpp-python) and match PyTorch token by token
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
      AIME_TESTS: all
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,export,openvino,graph]"
      - name: OpenVINO exports run and match PyTorch
        run: pytest -q -p no:cacheprovider -rfE tests/test_openvino.py tests/test_export.py -k "openvino"
      - name: Install gguf and llama.cpp
        run: |
          pip install -e ".[gguf]"
          pip install llama-cpp-python --prefer-binary \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -c "import llama_cpp, gguf"      # the checks below skip without them
      - name: GGUF exports load in llama.cpp, match PyTorch and tokenize like the run
        run: pytest -q -p no:cacheprovider -rfE --run-slow tests/test_v311_features.py -k "gguf"

  test-tools:
    # 3.2 Phase 3: MLflow (local SQLite store) and W&B (offline) mirror real runs; the
    # Hub and Kaggle clients are faked (real calls only in the nightly job)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,serve,export,data,tracking,hub,kaggle]"
      - name: Tracking, registries, the Hub, Kaggle / Hub datasets, run export
        run: pytest -q -p no:cacheprovider tests/test_integrations.py

  test-audio:
    # the audio extra (Hugging Face speech encoders): speech and sequence blocks, their
    # training loops and serving, offline with random weights
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for headless Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,audio,text,serve]" pandas
      - name: Test
        run: >-
          pytest -q -p no:cacheprovider tests/test_speech.py tests/test_sequence.py
          tests/test_codegen_runtime.py -k "audio or exercised or hf_text"
      - name: Pretrained text and audio recipes (random weights)
        run: pytest -q -p no:cacheprovider tests/test_pretrained_recipes.py -k "not image"
      - name: AST filterbanks
        run: pytest -q -p no:cacheprovider tests/test_block_coverage.py -k "test_ast"

  web:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Committed bundle is up to date
        run: git diff --exit-code --stat -- ai_made_easy/server/static
      - name: Install the server
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
          # pillow: image dataset profiles; scikit-learn: the demo tables the recipes use
          pip install -e ".[serve,data]" pillow scikit-learn
          # torch: the multi-objective AutoML smoke test trains the neural recipes
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # keras: a design that chooses Keras finds its learning rate with it (3.10)
          pip install keras
      - name: Browser smoke tests
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          AIME_BIN=aime npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  docker:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the web server image
        run: docker build -t ai-made-easy .
      - name: Container serves the UI and API
        run: |
          docker run -d --name aime -p 8765:8765 -e AIME_WEB_TOKEN=ci-token ai-made-easy
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/api/info && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8765/ | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/blocks)" = 401
          curl -sf -H "Authorization: Bearer ci-token" http://127.0.0.1:8765/api/blocks > /dev/null
          docker logs aime | tail -20
      - name: Every model family's libraries are in the image
        run: |
          docker run --rm ai-made-easy python -c "
          from ai_made_easy.core.registry import get_registry
          from ai_made_easy.core.spec import missing_requirements
          import ai_made_easy.core.blocks
          gaps = {b.type_id: missing_requirements(b) for b in get_registry().all()
                  if missing_requirements(b) and not b.type_id.startswith('llm.')}
          assert not gaps, gaps
          print('all block requirements installed')"
      - name: The image works with your tools (MLflow, W&B, the Hub)
        run: |
          docker run --rm ai-made-easy python -c "
          from ai_made_easy.core import api
          status = api.tracking_status()
          assert all(t['installed'] for t in status['trackers']), status
          import ai_made_easy, datasets, huggingface_hub
          print(ai_made_easy.__version__, [t['id'] for t in status['trackers']])"


  package:
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" pillow
      - name: Build the desktop bundle
        run: bash scripts/build_app.sh
      - name: Bundle ships the package sources used by subprocesses
        run: |
          test -f "dist/AI Made Easy/_internal/ai_made_easy/core/importers/onnx_import.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/worker/train_worker.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/core/pipelines/stages.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/samples/pipeline_distill_quantize.json"
          # 3.2: remote launcher, tracking, Hub / Kaggle integrations, environment probe
          test -f "dist/AI Made Easy/_internal/ai_made_easy/worker/aime_launch.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/core/tracking.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/core/integrations/hub.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/core/rl/spaces.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/samples/rl_atari_pong_ppo.json"
      - name: The bundled app starts
        run: |
          export AIME_HOME="$(mktemp -d)"
          "dist/AI Made Easy/AI Made Easy" > app.log 2>&1 &
          PID=$!
          sleep 15
          kill -0 "$PID" || { cat app.log; exit 1; }
          kill "$PID"

  package-windows:
    # the Windows desktop bundle builds and starts (3.7)
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]" pillow
      - name: Build the desktop bundle
        shell: bash
        run: bash scripts/build_app.sh
      - name: Bundle ships the package sources used by subprocesses
        shell: bash
        run: |
          test -f "dist/AI Made Easy/AI Made Easy.exe"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/worker/train_worker.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/worker/aime_launch.py"
          test -f "dist/AI Made Easy/_internal/ai_made_easy/core/tryit.py"
      - name: The bundled app starts
        shell: pwsh
        run: |
          $env:AIME_HOME = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "aime-home")
          $p = Start-Process -FilePath "dist/AI Made Easy/AI Made Easy.exe" -PassThru `
            -RedirectStandardOutput app.log -RedirectStandardError app.err
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Get-Content app.log, app.err; exit 1 }
          Stop-Process -Id $p.Id
